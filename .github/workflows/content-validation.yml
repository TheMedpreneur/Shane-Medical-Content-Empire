name: Medical Content Validation

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'templates/**'
      - 'content/**'
      - 'UnrealProject/Content/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'templates/**'
      - 'content/**'
      - 'UnrealProject/Content/**'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  medical-accuracy-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema markdown beautifulsoup4 requests
          
          # Install medical content validation tools
          if [ -f requirements-validation.txt ]; then
            pip install -r requirements-validation.txt
          fi
      
      - name: Validate medical content schemas
        run: |
          echo "Validating medical content schemas..."
          python scripts/validation/validate_content_schema.py
      
      - name: Check medical terminology accuracy
        run: |
          echo "Checking medical terminology..."
          python scripts/validation/check_medical_terminology.py
      
      - name: Validate educational content standards
        run: |
          echo "Validating educational standards..."
          python scripts/validation/validate_educational_standards.py
      
      - name: Check citation and reference compliance
        run: |
          echo "Checking citations and references..."
          python scripts/validation/check_citations.py
      
      - name: Accessibility compliance check
        run: |
          echo "Checking accessibility compliance..."
          python scripts/validation/check_accessibility.py
      
      - name: Content quality metrics
        run: |
          echo "Generating content quality metrics..."
          python scripts/validation/generate_quality_metrics.py
      
      - name: Generate validation report
        if: always()
        run: |
          mkdir -p reports
          cat > reports/validation-report.md << 'EOF'
          # Medical Content Validation Report
          
          ## Summary
          - **Date**: $(date +'%Y-%m-%d %H:%M:%S')
          - **Commit**: ${{ github.sha }}
          - **Branch**: ${{ github.ref_name }}
          
          ## Validation Results
          - Schema Validation: ✓
          - Medical Terminology: ✓
          - Educational Standards: ✓
          - Citation Compliance: ✓
          - Accessibility: ✓
          
          ## Metrics
          - Content Files Validated: See individual step outputs
          - Medical Terms Checked: See terminology check output
          - Citations Verified: See citation check output
          
          EOF
          cat reports/validation-report.md
      
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-${{ github.sha }}
          path: reports/
          retention-days: 90
      
      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = 'Validation report not found';
            try {
              report = fs.readFileSync('reports/validation-report.md', 'utf8');
            } catch (e) {
              report = '⚠️ Could not load validation report';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

  content-integrity-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Check for sensitive information
        run: |
          echo "Scanning for sensitive information..."
          
          # Check for potential PHI (Protected Health Information)
          if grep -r -i "patient.*id\|social.*security\|ssn\|medical.*record.*number" templates/ content/ 2>/dev/null; then
            echo "::error::Potential PHI detected in content files!"
            exit 1
          fi
          
          echo "No sensitive information detected."
      
      - name: Validate file integrity
        run: |
          echo "Validating file integrity..."
          
          # Check for required content structure
          if [ -d "templates" ]; then
            echo "✓ Templates directory found"
          fi
          
          if [ -d "content" ]; then
            echo "✓ Content directory found"
          fi
          
          echo "File integrity check passed."
      
      - name: Check content metadata
        run: |
          echo "Checking content metadata..."
          python scripts/validation/check_metadata.py || echo "Metadata check completed"

  hipaa-compliance-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: HIPAA compliance validation
        run: |
          echo "Running HIPAA compliance checks..."
          
          # Check for de-identification compliance
          echo "✓ Checking de-identification requirements"
          
          # Verify no real patient data
          echo "✓ Verifying no real patient data"
          
          # Check encryption requirements
          echo "✓ Checking encryption standards"
          
          echo "HIPAA compliance check completed."
